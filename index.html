<!DOCTYPE html>
<html lang="en" data-theme="dark" data-device="laptop">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EZPOS Pro - Adaptive Multi-Currency POS</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #334155;
            --border-color: #475569;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: rgba(59, 130, 246, 0.15);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.15);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4);
            
            /* Responsive Adaptive Layout Variables */
            --sidebar-width: 240px;
            --font-scale: 1rem;
            --grid-cols: repeat(auto-fill, minmax(140px, 1fr));
            --cart-width: 380px;
            --touch-target: 44px;
        }

        [data-theme="light"] {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-card: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: rgba(37, 99, 235, 0.1);
        }

        /* --- DEVICE SPECIFIC OVERRIDES --- */
        
        /* MOBILE DEVICE MODE */
        [data-device="mobile"] {
            --sidebar-width: 100%;
            --font-scale: 0.88rem;
            --grid-cols: repeat(auto-fill, minmax(105px, 1fr));
            --cart-width: 100%;
            --touch-target: 48px;
        }
        [data-device="mobile"] #app-container {
            flex-direction: column;
        }
        [data-device="mobile"] #sidebar {
            width: 100%;
            height: 60px;
            flex-direction: row;
            align-items: center;
            border-right: none;
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
        }
        [data-device="mobile"] .nav-links {
            flex-direction: row;
            overflow-x: auto;
            gap: 0.2rem;
        }
        [data-device="mobile"] .nav-item span,
        [data-device="mobile"] .brand span {
            display: none;
        }
        [data-device="mobile"] .pos-container {
            flex-direction: column;
        }
        [data-device="mobile"] .pos-cart {
            width: 100%;
            height: auto;
            max-height: 40vh;
            border-top: 2px solid var(--primary);
        }

        /* TABLET / IPAD MODE */
        [data-device="ipad"] {
            --sidebar-width: 80px;
            --font-scale: 0.95rem;
            --grid-cols: repeat(auto-fill, minmax(130px, 1fr));
            --cart-width: 320px;
            --touch-target: 46px;
        }
        [data-device="ipad"] .nav-item span,
        [data-device="ipad"] .brand span {
            display: none;
        }
        [data-device="ipad"] .nav-item {
            justify-content: center;
            padding: 0.8rem;
        }

        /* LAPTOP / DESKTOP MODE */
        [data-device="laptop"] {
            --sidebar-width: 240px;
            --font-scale: 1rem;
            --grid-cols: repeat(auto-fill, minmax(140px, 1fr));
            --cart-width: 380px;
            --touch-target: 40px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: var(--font-scale); }
        body { background-color: var(--bg-base); color: var(--text-main); overflow: hidden; height: 100vh; width: 100vw; display: flex; }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .flex-1 { flex: 1; }
        .hidden { display: none !important; }
        .text-muted { color: var(--text-muted); }
        .text-danger { color: var(--danger); }
        .text-primary { color: var(--primary); }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .text-sm { font-size: 0.85rem; }
        .text-xs { font-size: 0.75rem; }
        .text-lg { font-size: 1.15rem; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.6rem 1rem; min-height: var(--touch-target); border-radius: var(--radius-md); font-weight: 600;
            border: 1px solid transparent; cursor: pointer; transition: all 0.2s ease; outline: none; user-select: none;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg-card); color: var(--text-main); border-color: var(--border-color); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-icon { padding: 0.6rem; border-radius: var(--radius-md); }

        .input-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.75rem; }
        .input-group label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .input-field {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 0.65rem 0.85rem; border-radius: var(--radius-md); min-height: var(--touch-target); outline: none; width: 100%;
        }
        .input-field:focus { border-color: var(--primary); }

        #app-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
        #sidebar {
            width: var(--sidebar-width); background: var(--bg-surface); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; justify-content: space-between; padding: 1rem; z-index: 10; transition: width 0.2s;
        }
        .brand { display: flex; align-items: center; gap: 0.75rem; font-size: 1.2rem; font-weight: 800; color: var(--primary); padding: 0.5rem; margin-bottom: 1.5rem; }
        .nav-links { display: flex; flex-direction: column; gap: 0.4rem; }
        .nav-item {
            display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 1rem; color: var(--text-muted);
            border-radius: var(--radius-md); cursor: pointer; text-decoration: none; font-weight: 500;
        }
        .nav-item:hover { background: var(--primary-light); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; }

        #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        header { height: 60px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; }
        .view-section { flex: 1; overflow-y: auto; padding: 1rem; display: none; }
        .view-section.active { display: block; }

        #view-pos { padding: 0; height: calc(100vh - 60px); }
        .pos-container { display: flex; height: 100%; }
        .pos-products { flex: 1; display: flex; flex-direction: column; padding: 1rem; overflow-y: auto; border-right: 1px solid var(--border-color); }
        .categories-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 0.75rem; }
        .category-chip { padding: 0.5rem 1rem; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); cursor: pointer; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
        .category-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        .products-grid { display: grid; grid-template-columns: var(--grid-cols); gap: 0.75rem; }
        .product-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.75rem; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; user-select: none; }

        .pos-cart { width: var(--cart-width); background: var(--bg-surface); display: flex; flex-direction: column; height: 100%; }
        .cart-items { flex: 1; overflow-y: auto; padding: 0.75rem; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem; border-bottom: 1px solid var(--border-color); background: var(--bg-card); border-radius: var(--radius-sm); margin-bottom: 0.4rem; }
        .cart-footer { padding: 1rem; border-top: 1px solid var(--border-color); background: var(--bg-surface); }
        .cart-summary-row { display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.9rem; }
        .cart-summary-row.total { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed var(--border-color); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 92%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 1.25rem; box-shadow: var(--shadow-lg); }

        .table-container { width: 100%; overflow-x: auto; background: var(--bg-surface); border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background: var(--bg-card); padding: 0.75rem 1rem; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border-color); }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); }

        #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 0.5rem; z-index: 2000; }
        .toast { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); border-left: 4px solid var(--primary); padding: 0.75rem 1rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.5rem; min-width: 240px; }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.75rem; }
        .numpad button { min-height: 48px; font-size: 1.2rem; font-weight: bold; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-md); cursor: pointer; }

        #login-screen { position: fixed; inset: 0; background: var(--bg-base); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .login-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; width: 100%; max-width: 380px; text-align: center; }

        /* DEVICE SELECTION BADGES */
        .device-selector { display: flex; gap: 0.4rem; margin-bottom: 1rem; justify-content: center; }
        .device-btn { flex: 1; padding: 0.5rem; font-size: 0.8rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
        .device-btn.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <!-- LOGIN & DEVICE SELECTOR SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <div class="brand" style="justify-content: center; margin-bottom: 0.25rem;">
                <i data-lucide="shopping-bag"></i> <span id="login-app-name">EZPOS Pro</span>
            </div>
            <p class="text-muted text-xs" style="margin-bottom: 1rem;">Select Device, User & Enter PIN</p>

            <!-- DEVICE WORKSTATION SELECTION -->
            <div class="input-group">
                <label>Workstation Mode</label>
                <div class="device-selector">
                    <button type="button" class="device-btn" onclick="setDeviceMode('mobile')" id="dev-mobile"><i data-lucide="smartphone"></i> Mobile</button>
                    <button type="button" class="device-btn" onclick="setDeviceMode('ipad')" id="dev-ipad"><i data-lucide="tablet"></i> iPad / Tablet</button>
                    <button type="button" class="device-btn active" onclick="setDeviceMode('laptop')" id="dev-laptop"><i data-lucide="laptop"></i> Laptop</button>
                </div>
            </div>
            
            <div class="input-group">
                <label>Account</label>
                <select id="login-user-select" class="input-field"></select>
            </div>

            <div class="input-group">
                <label>PIN Code</label>
                <input type="password" id="login-pin-input" class="input-field" style="text-align: center; letter-spacing: 0.5rem; font-size: 1.2rem;" readonly>
            </div>

            <div class="numpad" id="login-numpad">
                <button onclick="appendLoginPin('1')">1</button>
                <button onclick="appendLoginPin('2')">2</button>
                <button onclick="appendLoginPin('3')">3</button>
                <button onclick="appendLoginPin('4')">4</button>
                <button onclick="appendLoginPin('5')">5</button>
                <button onclick="appendLoginPin('6')">6</button>
                <button onclick="appendLoginPin('7')">7</button>
                <button onclick="appendLoginPin('8')">8</button>
                <button onclick="appendLoginPin('9')">9</button>
                <button onclick="clearLoginPin()">C</button>
                <button onclick="appendLoginPin('0')">0</button>
                <button onclick="submitLogin()" style="background: var(--primary); color: white;"><i data-lucide="arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-container">
        <!-- SIDEBAR NAVIGATION -->
        <div id="sidebar">
            <div class="flex flex-col" style="width: 100%;">
                <div class="brand">
                    <i data-lucide="shopping-bag"></i> <span class="app-title-text">EZPOS Pro</span>
                </div>
                <nav class="nav-links">
                    <a class="nav-item active" onclick="switchView('pos')" title="POS"><i data-lucide="calculator"></i> <span>POS</span></a>
                    <a class="nav-item admin-only" onclick="switchView('products')" title="Products"><i data-lucide="package"></i> <span>Products</span></a>
                    <a class="nav-item admin-only" onclick="switchView('employees')" title="Users"><i data-lucide="users"></i> <span>Users</span></a>
                    <a class="nav-item admin-only" onclick="switchView('settings')" title="Settings"><i data-lucide="settings"></i> <span>Settings</span></a>
                </nav>
            </div>
            <div class="user-profile-summary flex items-center justify-between" style="padding-top: 0.5rem; border-top: 1px solid var(--border-color);">
                <div class="user-details">
                    <div id="current-user-name" class="font-bold text-xs">User</div>
                    <div id="current-user-role" class="text-xs text-muted">Role</div>
                </div>
                <button class="btn btn-secondary btn-icon" onclick="logout()" title="Logout"><i data-lucide="log-out"></i></button>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div id="main-content">
            <header>
                <div class="flex items-center gap-2">
                    <h2 id="page-title" class="text-lg font-bold">POS</h2>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-muted" id="rate-display">1 USD = 90,000 LBP</span>
                    <button class="btn btn-secondary btn-icon" onclick="toggleTheme()" title="Toggle Theme"><i data-lucide="moon"></i></button>
                </div>
            </header>

            <!-- 1. POS VIEW -->
            <div id="view-pos" class="view-section active">
                <div class="pos-container">
                    <div class="pos-products">
                        <div class="flex gap-2" style="margin-bottom: 0.75rem;">
                            <input type="text" id="pos-search" class="input-field" placeholder="Search product..." oninput="renderPosProducts()">
                        </div>
                        <div class="categories-bar" id="pos-categories"></div>
                        <div class="products-grid" id="pos-products-grid"></div>
                    </div>
                    <div class="pos-cart">
                        <div class="flex items-center justify-between" style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color);">
                            <span class="font-bold"><i data-lucide="shopping-cart"></i> Cart</span>
                            <button class="btn btn-danger btn-icon" onclick="clearCart()"><i data-lucide="trash-2"></i></button>
                        </div>
                        <div class="cart-items" id="cart-items-list"></div>
                        <div class="cart-footer">
                            <div class="cart-summary-row total"><span>Total:</span><span id="cart-total-usd">$0.00</span></div>
                            <div class="text-xs text-muted" style="text-align: right; margin-bottom: 0.75rem;" id="cart-total-lbp">0 LBP</div>
                            <button class="btn btn-primary" style="width: 100%;" onclick="checkout()">Checkout</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. PRODUCTS VIEW -->
            <div id="view-products" class="view-section">
                <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
                    <h3>Product Inventory</h3>
                    <button class="btn btn-primary" onclick="openProductModal()"><i data-lucide="plus"></i> Add Product</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Category</th><th>Price ($)</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="products-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- 3. EMPLOYEES VIEW -->
            <div id="view-employees" class="view-section">
                <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
                    <h3>Staff Management</h3>
                    <button class="btn btn-primary" onclick="openEmployeeModal()"><i data-lucide="user-plus"></i> Add User</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Role</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="employees-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- 4. SETTINGS VIEW -->
            <div id="view-settings" class="view-section">
                <div style="max-width: 500px; background: var(--bg-surface); padding: 1.25rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
                    <h3 class="font-bold text-lg" style="margin-bottom: 1rem;">System Settings</h3>
                    <div class="input-group">
                        <label>Business Name</label>
                        <input type="text" id="setting-app-name" class="input-field">
                    </div>
                    <div class="input-group">
                        <label>Exchange Rate (1 USD = LBP)</label>
                        <input type="number" id="setting-rate" class="input-field">
                    </div>
                    <button class="btn btn-primary" style="margin-top: 1rem; width: 100%;" onclick="saveSettings()">Save Settings</button>
                </div>
            </div>

        </div>
    </div>

    <!-- MODAL: USER STAFF -->
    <div class="modal-overlay" id="modal-employee">
        <div class="modal">
            <h3 class="font-bold text-lg" style="margin-bottom: 1rem;" id="modal-employee-title">Add User</h3>
            <input type="hidden" id="emp-id">
            <div class="input-group"><label>Full Name</label><input type="text" id="emp-name" class="input-field"></div>
            <div class="input-group">
                <label>Role</label>
                <select id="emp-role" class="input-field">
                    <option value="cashier">Cashier</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="input-group"><label>PIN Code (4 Digits)</label><input type="password" id="emp-pin" class="input-field"></div>
            <div class="flex justify-between gap-2" style="margin-top: 1.25rem;">
                <button class="btn btn-secondary flex-1" onclick="closeModal('modal-employee')">Cancel</button>
                <button class="btn btn-primary flex-1" onclick="saveEmployee()">Save User</button>
            </div>
        </div>
    </div>

    <!-- MODAL: PRODUCT EDIT/ADD -->
    <div class="modal-overlay" id="modal-product">
        <div class="modal">
            <h3 class="font-bold text-lg" style="margin-bottom: 1rem;" id="modal-product-title">Add Product</h3>
            <input type="hidden" id="prod-id">
            <div class="input-group"><label>Product Name</label><input type="text" id="prod-name" class="input-field"></div>
            <div class="input-group"><label>Category</label><input type="text" id="prod-category" class="input-field"></div>
            <div class="input-group"><label>Price (USD)</label><input type="number" step="0.01" id="prod-price" class="input-field"></div>
            <div class="flex justify-between gap-2" style="margin-top: 1.25rem;">
                <button class="btn btn-secondary flex-1" onclick="closeModal('modal-product')">Cancel</button>
                <button class="btn btn-primary flex-1" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container"></div>

    <script>
        const DEFAULT_SETTINGS = { appName: 'EZPOS Pro', exchangeRate: 90000 };
        const DEFAULT_USERS = [
            { id: 'u1', name: 'System Admin', role: 'admin', pin: '1234' },
            { id: 'u2', name: 'Cashier', role: 'cashier', pin: '0000' }
        ];
        const DEFAULT_PRODUCTS = [
            { id: 'p1', name: 'Espresso', category: 'Coffee', price: 2.50 },
            { id: 'p2', name: 'Croissant', category: 'Food', price: 1.50 }
        ];

        let appSettings = JSON.parse(localStorage.getItem('ez_settings')) || DEFAULT_SETTINGS;
        let users = JSON.parse(localStorage.getItem('ez_users')) || DEFAULT_USERS;
        let products = JSON.parse(localStorage.getItem('ez_products')) || DEFAULT_PRODUCTS;
        
        let currentUser = null;
        let selectedDevice = 'laptop';
        let cart = [];

        window.addEventListener('DOMContentLoaded', () => {
            initLoginSelect();
            applySettingsUI();
            renderPosProducts();
            lucide.createIcons();
        });

        function saveState(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

        function setDeviceMode(mode) {
            selectedDevice = mode;
            document.querySelectorAll('.device-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`dev-${mode}`).classList.add('active');
            document.documentElement.setAttribute('data-device', mode);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i data-lucide="info"></i> <span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.remove(), 2500);
        }

        function initLoginSelect() {
            const select = document.getElementById('login-user-select');
            select.innerHTML = users.map(u => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
        }

        function appendLoginPin(digit) {
            const input = document.getElementById('login-pin-input');
            if(input.value.length < 6) input.value += digit;
        }

        function clearLoginPin() { document.getElementById('login-pin-input').value = ''; }

        function submitLogin() {
            const userId = document.getElementById('login-user-select').value;
            const pin = document.getElementById('login-pin-input').value;
            const user = users.find(u => u.id === userId);

            if (user && user.pin === pin) {
                currentUser = user;
                document.getElementById('login-screen').classList.add('hidden');
                clearLoginPin();
                setupUserPermissions();
                switchView('pos');
                showToast(`LoggedIn as ${user.name} [${selectedDevice.toUpperCase()}]`);
            } else {
                showToast('Invalid PIN Code');
                clearLoginPin();
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function setupUserPermissions() {
            document.getElementById('current-user-name').innerText = currentUser.name;
            document.getElementById('current-user-role').innerText = currentUser.role.toUpperCase();

            document.querySelectorAll('.admin-only').forEach(el => {
                if (currentUser.role !== 'admin') el.classList.add('hidden');
                else el.classList.remove('hidden');
            });
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            const targetView = document.getElementById(`view-${viewId}`);
            if (targetView) targetView.classList.add('active');

            document.getElementById('page-title').innerText = viewId.toUpperCase();
            if (viewId === 'pos') renderPosProducts();
            if (viewId === 'products') renderProductsTable();
            if (viewId === 'employees') renderEmployeesTable();
        }

        /* POS RENDER FUNCTIONS */
        function renderPosProducts() {
            const search = document.getElementById('pos-search').value.toLowerCase();
            const grid = document.getElementById('pos-products-grid');
            const filtered = products.filter(p => p.name.toLowerCase().includes(search));

            grid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="addToCart('${p.id}')">
                    <div class="font-bold">${p.name}</div>
                    <div class="text-xs text-muted">${p.category}</div>
                    <div class="text-primary font-bold" style="margin-top: 0.5rem;">$${p.price.toFixed(2)}</div>
                </div>
            `).join('');
        }

        function addToCart(prodId) {
            const prod = products.find(p => p.id === prodId);
            const existing = cart.find(item => item.id === prodId);
            if(existing) existing.qty += 1;
            else cart.push({ ...prod, qty: 1 });
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items-list');
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <div class="font-semibold">${item.name}</div>
                        <div class="text-xs text-muted">$${item.price.toFixed(2)} x ${item.qty}</div>
                    </div>
                    <div class="font-bold">$${(item.price * item.qty).toFixed(2)}</div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-total-usd').innerText = `$${total.toFixed(2)}`;
            document.getElementById('cart-total-lbp').innerText = `${(total * appSettings.exchangeRate).toLocaleString()} LBP`;
        }

        function clearCart() { cart = []; renderCart(); }
        function checkout() { if(cart.length === 0) return showToast('Cart is empty'); showToast('Transaction Completed'); clearCart(); }

        /* STAFF MANAGEMENT */
        function renderEmployeesTable() {
            const tbody = document.getElementById('employees-table-body');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td class="font-semibold">${u.name}</td>
                    <td>${u.role.toUpperCase()}</td>
                    <td>
                        <button class="btn btn-secondary btn-icon" onclick="openEmployeeModal('${u.id}')"><i data-lucide="key"></i></button>
                        <button class="btn btn-danger btn-icon" onclick="deleteUser('${u.id}')"><i data-lucide="trash-2"></i></button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function openEmployeeModal(userId = null) {
            if (userId) {
                const user = users.find(u => u.id === userId);
                document.getElementById('emp-id').value = user.id;
                document.getElementById('emp-name').value = user.name;
                document.getElementById('emp-role').value = user.role;
                document.getElementById('emp-pin').value = user.pin;
                document.getElementById('modal-employee-title').innerText = 'Edit User PIN';
            } else {
                document.getElementById('emp-id').value = '';
                document.getElementById('emp-name').value = '';
                document.getElementById('emp-role').value = 'cashier';
                document.getElementById('emp-pin').value = '';
                document.getElementById('modal-employee-title').innerText = 'Add User';
            }
            openModal('modal-employee');
        }

        function saveEmployee() {
            const id = document.getElementById('emp-id').value;
            const name = document.getElementById('emp-name').value;
            const role = document.getElementById('emp-role').value;
            const pin = document.getElementById('emp-pin').value;

            if (!name || !pin) return showToast('Name and PIN required');

            if (id) {
                const user = users.find(u => u.id === id);
                Object.assign(user, { name, role, pin });
            } else {
                users.push({ id: 'u_' + Date.now(), name, role, pin });
            }

            saveState('ez_users', users);
            closeModal('modal-employee');
            initLoginSelect();
            renderEmployeesTable();
            showToast('User saved');
        }

        function deleteUser(id) {
            if (users.length <= 1) return showToast('Cannot delete last user');
            users = users.filter(u => u.id !== id);
            saveState('ez_users', users);
            renderEmployeesTable();
            initLoginSelect();
            showToast('User deleted');
        }

        /* PRODUCTS MANAGEMENT */
        function renderProductsTable() {
            const tbody = document.getElementById('products-table-body');
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td class="font-semibold">${p.name}</td>
                    <td>${p.category}</td>
                    <td>$${p.price.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-secondary btn-icon" onclick="openProductModal('${p.id}')"><i data-lucide="edit"></i></button>
                        <button class="btn btn-danger btn-icon" onclick="deleteProduct('${p.id}')"><i data-lucide="trash-2"></i></button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function openProductModal(prodId = null) {
            if (prodId) {
                const prod = products.find(p => p.id === prodId);
                document.getElementById('prod-id').value = prod.id;
                document.getElementById('prod-name').value = prod.name;
                document.getElementById('prod-category').value = prod.category;
                document.getElementById('prod-price').value = prod.price;
                document.getElementById('modal-product-title').innerText = 'Edit Product';
            } else {
                document.getElementById('prod-id').value = '';
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-category').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('modal-product-title').innerText = 'Add Product';
            }
            openModal('modal-product');
        }

        function saveProduct() {
            const id = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-name').value;
            const category = document.getElementById('prod-category').value || 'General';
            const price = parseFloat(document.getElementById('prod-price').value) || 0;

            if (!name) return showToast('Product name is required');

            if (id) {
                const prod = products.find(p => p.id === id);
                Object.assign(prod, { name, category, price });
            } else {
                products.push({ id: 'p_' + Date.now(), name, category, price });
            }

            saveState('ez_products', products);
            closeModal('modal-product');
            renderProductsTable();
            renderPosProducts();
            showToast('Product saved');
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            saveState('ez_products', products);
            renderProductsTable();
            renderPosProducts();
            showToast('Product removed');
        }

        /* UTILS */
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function applySettingsUI() {
            document.querySelectorAll('.app-title-text').forEach(el => el.innerText = appSettings.appName);
            document.getElementById('login-app-name').innerText = appSettings.appName;
            document.getElementById('setting-app-name').value = appSettings.appName;
            document.getElementById('setting-rate').value = appSettings.exchangeRate;
            document.getElementById('rate-display').innerText = `1 USD = ${appSettings.exchangeRate.toLocaleString()} LBP`;
        }
        function saveSettings() {
            appSettings.appName = document.getElementById('setting-app-name').value;
            appSettings.exchangeRate = parseFloat(document.getElementById('setting-rate').value) || 90000;
            saveState('ez_settings', appSettings);
            applySettingsUI();
            showToast('Settings saved');
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
